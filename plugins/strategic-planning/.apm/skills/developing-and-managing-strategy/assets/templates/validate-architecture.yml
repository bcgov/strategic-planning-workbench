name: Validate Architecture Workbench

on:
  pull_request:
  push:
    branches: [main]

# Deny-all top-level permissions per BC Gov GitHub Actions hardening standards.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-architecture:
    # Job name must match the GitHub Ruleset required status check context exactly.
    name: Validate Architecture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pin third-party actions to a full commit SHA for supply-chain safety (update via Dependabot).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          python3 -c "
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts or 'temp' in p.parts:
                  continue
              json.loads(p.read_text(encoding='utf-8'))
          print('All JSON files valid.')
          "

      - name: Check relative Markdown links
        run: |
          python3 -c "
          import pathlib, re, sys
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          broken = []
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts or 'history' in md.parts or 'temp' in md.parts:
                  continue
              in_fence = False
              for lineno, line in enumerate(md.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  if line.strip().startswith('\`\`\`'):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for m in link_re.finditer(line):
                      target = m.group(1).strip().split('#')[0]
                      if not target or target.startswith(('http://', 'https://', 'mailto:', 'file://', '#')):
                          continue
                      if not (md.parent / target).resolve().exists():
                          broken.append(f'{md}:{lineno} -> {target}')
          if broken:
              print('Broken links:\n' + '\n'.join(broken))
              sys.exit(1)
          print('All relative Markdown links valid.')
          "
